name: Offline and loopback verification
on: [push, workflow_dispatch]
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      # Only the disposable CI runner selects CPython. WebRecon itself uses the standard library.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: CLI, report and integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          python -S -m webrecon --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -S -m webrecon plan --config tests/fixtures/config.loopback.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # A missing socket, certificate tool or browser must stay visible in the result.
          python -B -c "import unittest; s=unittest.defaultTestLoader.discover('tests'); r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not r.wasSuccessful() or bool(r.skipped))"
          exit $LASTEXITCODE
