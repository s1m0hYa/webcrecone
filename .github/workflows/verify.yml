name: Offline and loopback verification
on: [push, workflow_dispatch]
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      # Only the disposable CI runner selects CPython. WebRecon itself uses the standard library.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: CLI, report and integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          python -S -m webrecon --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -S -m webrecon plan --config tests/fixtures/config.loopback.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Windows에는 POSIX FIFO API가 없다. 그 한 건 외의 skip은 검증 누락이다.
          @'
          import os
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          allowed = set()
          if os.name == "nt" and not hasattr(os, "mkfifo"):
              allowed.add("test_local_analysis.LocalAnalysisTests.test_fifo_is_rejected_without_opening")
          unexpected = [test.id() for test, reason in result.skipped if test.id() not in allowed]
          raise SystemExit(not result.wasSuccessful() or bool(unexpected))
          '@ | python -B -
          exit $LASTEXITCODE
